<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css">
<style>
    /* Floating TOC: stays fixed on the screen while the page scrolls */
    .markdown-toc-float { position: fixed; top: 5rem; right: 1rem; z-index: 1030; display: flex; flex-direction: column; align-items: flex-end; }
    .markdown-toc-panel { width: 280px; max-width: calc(100vw - 2rem); max-height: calc(100vh - 9rem); overflow-y: auto; }
    .markdown-toc-panel a { text-decoration: none; }
    .markdown-toc-panel a:hover { text-decoration: underline; }
    .markdown-toc-panel .toc-level-1 { font-weight: 600; }
    .markdown-toc-panel .toc-level-3 { padding-left: 1rem; }
    .markdown-toc-panel .toc-level-4 { padding-left: 2rem; }
    /* Leave space above the heading when jumping to it, so the sticky topbar (48px) doesn't cover it */
    .markdown-body :is(h1, h2, h3, h4, h5, h6)[id] { scroll-margin-top: 4rem; }
    html { scroll-behavior: smooth; }
</style>
{% if markdown_text.toc %}
    <div class="markdown-toc-float">
        <button class="btn btn-dark btn-sm shadow"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#markdownTocPanel"
                aria-expanded="false"
                aria-controls="markdownTocPanel"
                title="Table of contents">
            <i class="bi bi-list-ul"></i> Contents
        </button>
        <div class="collapse mt-2" id="markdownTocPanel">
            <nav class="markdown-toc-panel bg-white border rounded shadow p-3 small"
                 aria-label="Table of contents">
                <div class="fw-semibold mb-2">Table of contents</div>
                <ul class="list-unstyled mb-0">
                    {% for item in markdown_text.toc %}
                        <li class="toc-level-{{ item.level }} mb-1">
                            <a href="#{{ item.id }}">{{ item.title }}</a>
                        </li>
                    {% endfor %}
                </ul>
            </nav>
        </div>
    </div>
{% endif %}
<div class="markdown-body">{{ markdown_text.html }}</div>
