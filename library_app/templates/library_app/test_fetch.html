{% extends "library_app/base.html" %}
{% block title %}Test Fetch - Admin Panel{% endblock %}
{% block page_title %}Test Fetch{% endblock %}
{% block content %}
    <div style="width: 320px">
        <input type="text" id="result-field" class="form-control mb-3" readonly>
        <button id="fetch-btn" class="btn btn-primary">Fetch from API</button>
    </div>
{% endblock %}
{% block extra_scripts %}
    <script>
    document.getElementById('fetch-btn').addEventListener('click', function () {
        fetch('/api/test-fetch/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result-field').value = data.text;
            });
    });
    </script>
{% endblock %}
