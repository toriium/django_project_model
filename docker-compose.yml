services:
  web:
    build: .
    restart: always
    expose:
      - "8000" # visible only to other containers on the compose network (Caddy), not published on the host
    env_file:
      - .env
    volumes:
      - static_files:/app/staticfiles

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static_files:/app/staticfiles
    depends_on:
      - web

  postgres_server:
    image: postgres:latest
    restart: always
    container_name: container_postgres
    expose:
      - "5432" # visible only to other containers on the compose network (web), not published on the host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

volumes:
  static_files:
  postgres_data:
