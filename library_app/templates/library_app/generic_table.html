{% extends "library_app/base.html" %}
{% block content %}
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator_bootstrap5.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <div class="container-fluid mt-4 h-100 d-flex flex-column">
        <h1>{{ table_name }}</h1>
        <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
            <input type="text"
                   id="global-search"
                   class="form-control form-control-sm w-auto"
                   placeholder="Global Search...">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary"
                        type="button"
                        data-bs-toggle="dropdown">
                    <i class="bi bi-download"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a id="export-csv" class="dropdown-item" href="#">CSV</a></li>
                    <li><a id="export-xlsx" class="dropdown-item" href="#">XLSX</a></li>
                    <li><a id="export-pdf" class="dropdown-item" href="#">PDF</a></li>
                </ul>
            </div>
        </div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="genericTable"></div>
        </div>
    </div>
    {{ columns|json_script:"columns-data" }}
    {{ data|json_script:"table-data" }}
    <script>
    // Read column names and row data injected by Django via json_script
    const columnNames = JSON.parse(document.getElementById('columns-data').textContent);
    const rows = JSON.parse(document.getElementById('table-data').textContent);
    // Tabulator needs objects keyed by field name, not plain arrays
    const tableData = rows.map(row => Object.fromEntries(columnNames.map((col, i) => [col, row[i]])));

    // Pick a header filter type based on the column's data type
    function filterTypeFor(col) {
        const sample = tableData.find(row => row[col] !== null && row[col] !== undefined);
        const value = sample ? sample[col] : null;
        if (typeof value === "boolean") {
            // true/false/all filter
            return { headerFilter: "tickCross", headerFilterParams: { tristate: true }, formatter: "tickCross" };
        }
        if (typeof value === "number") {
            // ">=" numeric filter
            return { headerFilter: "number", headerFilterFunc: ">=" };
        }
        // dropdown filter built automatically from the distinct values in the column
        return {
            headerFilter: "list",
            headerFilterParams: { valuesLookup: true, clearable: true, multiselect: true },
            headerFilterFunc: "in",
        };
    }

    // Build the table, generating one column per field with its matching filter
    const table = new Tabulator("#genericTable", {
        data: tableData,
        layout: "fitColumns",
        pagination: true,
        paginationSize: 15,
        paginationSizeSelector: [10, 15, 25, 50, 100],
        paginationCounter: "rows",
        columns: columnNames.map(col => ({
            title: col.charAt(0).toUpperCase() + col.slice(1),
            field: col,
            ...filterTypeFor(col),
        })),
    });

    // Global search box: match the typed term against any column value
    document.getElementById("global-search").addEventListener("input", (e) => {
        const term = e.target.value.trim().toLowerCase();
        if (!term) {
            table.clearFilter();
            return;
        }
        table.setFilter((data) => columnNames.some((col) => String(data[col] ?? "").toLowerCase().includes(term)));
    });

    // Export buttons, one per file format
    document.getElementById("export-csv").addEventListener("click", (e) => { e.preventDefault(); table.download("csv", "table.csv"); });
    document.getElementById("export-xlsx").addEventListener("click", (e) => { e.preventDefault(); table.download("xlsx", "table.xlsx", { sheetName: "Data" }); });
    document.getElementById("export-pdf").addEventListener("click", (e) => { e.preventDefault(); table.download("pdf", "table.pdf", { orientation: "landscape", title: "Table" }); });
    </script>
{% endblock %}
