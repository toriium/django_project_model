<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5">
            <h4 class="card-title fw-bold mb-4">Admin Panel</h4>

            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">Username</label>
                    <input
                        type="text"
                        id="{{ form.username.id_for_label }}"
                        name="{{ form.username.html_name }}"
                        class="form-control {% if form.username.errors %}is-invalid{% endif %}"
                        autofocus
                        value="{{ form.username.value|default:'' }}"
                    >
                    {% for error in form.username.errors %}
                        <div class="invalid-feedback">{{ error }}</div>
                    {% endfor %}
                </div>

                <div class="mb-4">
                    <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">Password</label>
                    <input
                        type="password"
                        id="{{ form.password.id_for_label }}"
                        name="{{ form.password.html_name }}"
                        class="form-control {% if form.password.errors %}is-invalid{% endif %}"
                    >
                    {% for error in form.password.errors %}
                        <div class="invalid-feedback">{{ error }}</div>
                    {% endfor %}
                </div>

                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
