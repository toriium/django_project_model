[tasks.up]
run = "docker compose --env-file ./envs/.env.dev up -d --build"

[tasks.down]
run = "docker compose down"

[tasks.logs]
run = "docker compose logs -f"

[tasks.local_setup]
description = "Set up the local development environment using Docker Compose"
run = "docker compose -f docker-compose.local.yml --env-file ./envs/.env.dev up -d --build"

[tasks.local]
run = "ENV=DEV uv run python manage.py runserver"

[tasks.format]
run = "ruff format && ruff check --fix"

[tasks.makemigrations]
run = "uv run python manage.py makemigrations"

[tasks.migrate]
run = "uv run python manage.py migrate"
