{% extends "library_app/base.html" %}

{% block title %}Login - Admin Panel{% endblock %}
{% block page_title %}Login{% endblock %}

{% block extra_styles %}
<style>
    .login-card {
        background: #fff;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 32px 36px;
        max-width: 380px;
    }
    .login-card h2 {
        margin-bottom: 24px;
        color: #1e2a38;
        font-size: 1.2em;
    }
    .login-card label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
        color: #1e2a38;
        font-size: 0.9em;
    }
    .login-card input[type="text"],
    .login-card input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 0.95em;
    }
    .login-card button {
        width: 100%;
        padding: 10px;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1em;
        cursor: pointer;
    }
    .login-card button:hover { background: #1558a8; }
    .error-msg {
        color: #d9534f;
        font-size: 0.88em;
        margin-bottom: 14px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
    <h2>&#128274; Login</h2>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
            <p class="error-msg">Invalid username or password.</p>
        {% endif %}
        <label for="id_username">Username</label>
        <input type="text" id="id_username" name="username" autofocus>

        <label for="id_password">Password</label>
        <input type="password" id="id_password" name="password">

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
